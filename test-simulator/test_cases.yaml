- id: chat_hello
  type: Chat
  messages:
  - 你好
  expect:
    has_response: true
    response_not_empty: true
    status_success: true
    no_tool_call: true
  tags:
  - smoke
- id: single_haidian_2br
  type: Single
  messages:
  - 帮我找海淀区的两居室，整租，价格在3000到6000元之间
  expect:
    has_response: true
    response_not_empty: true
    response_json_valid: true
    status_success: true
    tool_call_args:
      tool: update_preferences
      contains:
        location:
        - 海淀
        bedrooms: '2'
        max_price: 6000
        min_price: 3000
        rental_type: 整租
    house_count_min: 1
  tags:
  - smoke
  - tool-call
- id: multi_progressive
  type: Multi
  messages:
  - 我想租房子，有什么推荐吗？
  - 海淀区有哪些两居室可以租？
  expect:
    has_response: true
    response_not_empty: true
    status_success: true
  round_expects:
  - round: 1
    expect: {}
  - round: 2
    expect:
      tool_call_args:
        tool: update_preferences
        contains:
          location:
          - 海淀
          bedrooms: '2'
      message_content:
      - HF_3
      - HF_33
      - HF_36
      - HF_37
      - HF_38
  tags:
  - multi-turn
- id: ev06_wangjing_to_daxing_rental_flow
  type: Multi
  fixture_file: mock_data/EV-06.yaml
  messages:
  - 我想在望京租一套两居室，预算8000以内，有电梯
  - 这套离地铁多远？
  - 换大兴区的看看吧，两居室，预算4000以内
  - 还是最开始望京那套比较好，它的详细情况怎么样？
  - 这套可以租吗？我想租这套
  expect:
    has_response: true
    response_not_empty: true
    status_success: true
  round_expects:
  - round: 1
    expect:
      tool_call_args:
        tool: update_preferences
        contains:
          location:
          - 望京
          bedrooms: '2'
          elevator: true
          max_price: 8000
      house_count_min: 1
  - round: 2
    expect:
      message_content:
      - '3786'
  - round: 3
    expect:
      tool_call_args:
        tool: update_preferences
        contains:
          location:
          - 大兴
          bedrooms: '2'
          max_price: 4000
      house_count_min: 1
  - round: 4
    expect:
      tool_call_args:
        tool: get_house_detail
        contains:
          house_id: HF_830
      house_count_min: 1
  - round: 5
    expect: {}
  tags:
  - ev06
  - multi-turn
  - rental-flow
  - tool-call
