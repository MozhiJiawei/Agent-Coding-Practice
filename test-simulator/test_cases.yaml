# 测试用例文件
# 断言引擎在 Story 6.1 中实现

test_cases:
  - id: chat_hello
    type: Chat
    messages:
      - "你好"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
      no_tool_call: true
    tags:
      - smoke

  - id: single_haidian_2br
    type: Single
    messages:
      - "帮我找海淀区的两居室，整租，价格在3000到6000元之间"
    expect:
      has_response: true
      response_not_empty: true
      response_json_valid: true
      status_success: true
      # 链式调用：先 update_preferences 再 search_by_preferences
      tool_call_chain: ["update_preferences", "search_by_preferences"]
      tool_call_args:
        tool: update_preferences
        contains:
          location: ["海淀"]
          bedrooms: "2"
          max_price: 6000
          min_price: 3000
          rental_type: "整租"
      # 返回的 HOUSE_ID 必须与 search 结果一致（基于 default fixture 海淀 2BR 3000-6000）
      houses_match: ["HF_33", "HF_380", "HF_1208", "HF_1748", "HF_1874"]
      house_count_min: 1
    tags:
      - smoke
      - tool-call

  - id: multi_progressive
    type: Multi
    messages:
      - "我想租房子，有什么推荐吗？"
      - "海淀区有哪些两居室可以租？"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
    round_expects:
      # Round 1: 首轮"有什么推荐"时 Agent 可能先回复引导语无工具调用，故不做强制校验
      - round: 1
        expect: {}
      - round: 2
        expect:
          tool_call_chain: ["update_preferences", "search_by_preferences"]
          tool_call_args:
            tool: update_preferences
            contains:
              location: ["海淀"]
              bedrooms: "2"
          message_content: 
            - "HF_3"
            - "HF_33"
            - "HF_36"
            - "HF_37"
            - "HF_38"
    tags:
      - multi-turn

  # ── EV-06: 望京→大兴→回望京→租房 完整多轮流程 ────────────────────────────────
  # 对应日志: logs/eval_l00933108_EV-06_1772426116496476236.jsonl
  # mock_data: mock_data/EV-06.yaml（由 extract_mock_data.py 从日志自动生成，含 landmarks + houses）
  #
  # 对话轨迹：
  #   Turn 1 → 搜索望京 2BR 电梯房 ≤8000，返回 HF_830（华润府6区）
  #   Turn 2 → 追问地铁距离（对话上下文理解）
  #   Turn 3 → 切换大兴区 2BR ≤4000
  #   Turn 4 → 返回望京，询问 HF_830 详情
  #   Turn 5 → 执行租房动作，HF_830 状态变为 rented
  - id: ev06_wangjing_to_daxing_rental_flow
    type: Multi
    fixture_file: mock_data/EV-06.yaml
    messages:
      - "我想在望京租一套两居室，预算8000以内，有电梯"
      - "这套离地铁多远？"
      - "换大兴区的看看吧，两居室，预算4000以内"
      - "还是最开始望京那套比较好，它的详细情况怎么样？"
      - "这套可以租吗？我想租这套"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
    round_expects:
      - round: 1
        expect:
          tool_call_chain: ["update_preferences", "search_by_preferences"]
          tool_call_args:
            tool: update_preferences
            contains:
              location: ["望京"]
              bedrooms: "2"
              elevator: true
              max_price: 8000
          houses_match: ["HF_830"]
      - round: 2
        expect:
          message_content: 
          - "3786"
      - round: 3
        expect:
          tool_call_chain: ["update_preferences", "search_by_preferences"]
          tool_call_args:
            tool: update_preferences
            contains:
              location: ["大兴"]
              bedrooms: "2"
              max_price: 4000
          houses_match_subset: true
          houses_match: ["HF_277", "HF_805", "HF_1069", "HF_1333"]
      - round: 4
        expect:
          tool_call_args:
            tool: get_house_detail
            contains:
              house_id: "HF_830"
          houses_match: ["HF_830"]
      - round: 5
        expect: {}
    tags:
      - ev06
      - multi-turn
      - rental-flow
      - tool-call

