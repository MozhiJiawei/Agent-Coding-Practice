# 测试用例文件
# 断言引擎在 Story 6.1 中实现

test_cases:
  - id: chat_hello
    type: Chat
    messages:
      - "你好"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
    tags:
      - smoke

  - id: single_haidian_2br
    type: Single
    messages:
      - "帮我找海淀区的两居室，整租，价格在3000到6000元之间"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
    tags:
      - smoke
      - tool-call

  - id: multi_progressive
    type: Multi
    messages:
      - "我想租房子，有什么推荐吗？"
      - "海淀区有哪些两居室可以租？"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
    tags:
      - multi-turn

  # ── EV-06: 望京→大兴→回望京→租房 完整多轮流程 ────────────────────────────────
  # 对应日志: logs/eval_l00933108_EV-06_1772426116496476236.jsonl
  # mock_data: mock_data/EV-06.yaml（由 extract_mock_data.py 从日志自动生成，含 landmarks + houses）
  #
  # 对话轨迹：
  #   Turn 1 → 搜索望京 2BR 电梯房 ≤8000，返回 HF_830（华润府6区）
  #   Turn 2 → 追问地铁距离（对话上下文理解）
  #   Turn 3 → 切换大兴区 2BR ≤4000
  #   Turn 4 → 返回望京，询问 HF_830 详情
  #   Turn 5 → 执行租房动作，HF_830 状态变为 rented
  - id: ev06_wangjing_to_daxing_rental_flow
    type: Multi
    fixture_file: "mock_data/EV-06.yaml"
    messages:
      - "我想在望京租一套两居室，预算8000以内，有电梯"
      - "这套离地铁多远？"
      - "换大兴区的看看吧，两居室，预算4000以内"
      - "还是最开始望京那套比较好，它的详细情况怎么样？"
      - "这套可以租吗？我想租这套"
    expect:
      has_response: true
      response_not_empty: true
      status_success: true
    tags:
      - ev06
      - multi-turn
      - rental-flow
      - tool-call

