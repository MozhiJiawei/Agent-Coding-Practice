# Test Simulator 全局配置文件
# 模型 API 可配置：通过 llm_proxy_url + api_key_file 切换不同厂商（如阿里云、SiliconFlow）

agent_base_url: "http://localhost:8191"             # Agent 服务地址（默认 8191）
model_proxy_port: 8888                              # Model Proxy 监听端口（默认 8888）

# 模型 API 配置（OpenAI 兼容格式）
# 阿里云 DashScope（美国区）：
llm_proxy_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
llm_model: "qwen3-32b"                             # 阿里云模型名，如 qwen-turbo / qwen-plus
api_key_file: "../.api_key_ali"                    # 阿里 API Key 文件（项目根目录 .api_key_ali）
# SiliconFlow 示例（需同时改 api_key_file 为 "../.api_key"）：
# llm_proxy_url: "https://api.siliconflow.cn/v1/chat/completions"
# llm_model: "Qwen/Qwen3-32B"
# api_key_file: "../.api_key"
# llm_api_key: ""                                  # 可选：若不设置则从 api_key_file 读取
mock_rental_port: 8080                              # Mock 租房 API 监听端口（默认 8080）
fixture_file: "mock_data/EV-06.yaml"                # Fixture 数据集路径（供 MockState 加载）
test_user_id: "your-employee-id"                    # 必填：X-User-ID 请求头值
test_cases_file: "test_cases.yaml"
timeout_per_case: 720
report_dir: "_bmad-output/test-reports"
max_concurrency: 6
dashboard_port: 8877
